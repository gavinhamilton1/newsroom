services:
  - type: cron
    name: dispatch-daily
    runtime: python
    # Render cron schedules are in UTC and do not follow daylight saving.
    # 10:30 UTC is 06:30 America/New_York during EDT (March to November).
    # When EST starts in November, change this to "30 11 * * 1-5". See README.
    schedule: "30 10 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dispatch_daily.main
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: DIGEST_MAX_ITEMS
        sync: false
      - key: LOOKBACK_HOURS
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: MAX_COST_USD
        sync: false
      - key: NVD_API_KEY
        sync: false
