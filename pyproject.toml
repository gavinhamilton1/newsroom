[project]
name = "dispatch-daily"
version = "0.1.0"
description = "Daily Architecture Dispatch digest: collect, extract, rank, write, publish to R2."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8,<2",
    "httpx>=0.28,<1",
    "feedparser>=6.0,<7",
    "trafilatura>=2.0,<3",
    "pyyaml>=6.0,<7",
    "jinja2>=3.1,<4",
    "boto3>=1.35,<2",
    "tenacity>=9.0,<10",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.16", "pytest>=9.0"]

[tool.setuptools]
packages = ["dispatch_daily"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
