# Architecture Dispatch source list
# Generated 2026-09-24. feed: is filled in by scripts/discover_feeds.py where one exists.
categories:
  - id: fin
    name: "Fintech and financial IT strategy"
    description: "Sector threats, regulation and banking technology."
  - id: cyber
    name: "Cybersecurity and digital identity"
    description: "Attacks, incidents and identity news with architectural lessons."
  - id: vuln
    name: "Vulnerabilities and advisories"
    description: "Check exploited-in-the-wild first, then the vendor advisory for anything in our stack. Verify every CVE identifier against NVD or the vendor before it is published."
  - id: ai
    name: "AI and agentic security"
    description: "Agent identity, prompt injection and AI supply chain."
  - id: std
    name: "Standards and primary sources"
    description: "Where the definitive text lives; check these before quoting secondary coverage."
  - id: pqc
    name: "Quantum and cryptography"
    description: "Post-quantum migration and crypto agility."
  - id: arch
    name: "Enterprise architecture and platform engineering"
    description: "Engineering practice, platforms, AI-assisted delivery and analyst views."
